{{- if .Values.subscription.create -}}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ include "debezium.fullname" . }}-strimzi-kafka-operator
  namespace: {{ .Values.subscription.namespace }}
  labels:
    {{- include "debezium.labels" . | nindent 4 }}
spec:
  channel: {{ .Values.subscription.channel }}
  name: {{ .Values.subscription.name }}
  source: {{ .Values.subscription.source }}
  sourceNamespace: {{ .Values.subscription.sourceNamespace }}
{{- end -}}