{{- if .Values.operatorGroup.create -}}
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ include "debezium.fullname" . }}-global-operators
  namespace: {{ .Values.operatorGroup.namespace }}
  labels:
    {{- include "debezium.labels" . | nindent 4 }}
status:
  namespaces:
  - {{ .Release.Namespace }}
{{- end -}}