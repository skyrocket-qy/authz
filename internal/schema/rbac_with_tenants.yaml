namespaces:
  tenant1_doc:
    relations:
      read:
        userset_rewrite:
          tuple_to_userset:
            tupleset:
              relation: read       # points to role object (e.g. role:reader)
            computed_userset:
              relation: member     # follow its member relation

      create:
        userset_rewrite:
          tuple_to_userset:
            tupleset:
              relation: create
            computed_userset:
              relation: member

      update:
        userset_rewrite:
          tuple_to_userset:
            tupleset:
              relation: update
            computed_userset:
              relation: member

      delete:
        userset_rewrite:
          tuple_to_userset:
            tupleset:
              relation: delete
            computed_userset:
              relation: member

  role:
    relations:
      member: {}   # users added to role via tuple


