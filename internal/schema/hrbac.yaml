namespaces:
  object:
    allow_subject_namespaces: [role]
    relations:
      read:
        union:
          - tuple_to_userset:
              computed_userset:
                relation: member     
          - tuple_to_userset:
              tupleset:
                relation: write
              computed_userset:
                relation: member
      write:
        tuple_to_userset:
          computed_userset:
            relation: member

  role:
    relations:
      member:
        allow_subject_namespaces: [user]
        union:
          - computed_userset:
              relation: member
          - tuple_to_userset:
              tupleset:
                relation: parent
              computed_userset:
                relation: member
      parent:
        allow_subject_namespaces: [role]
        union:
          - computed_userset:
              relation: parent
          - tuple_to_userset:
              computed_userset:
                relation: parent

  user: {}