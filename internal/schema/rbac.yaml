namespaces:
  doc:
    relations:
      read:
        tuple_to_userset:
          tupleset:
            relation: reader       # points to role object (e.g. role:reader)
          computed_userset:
            relation: member     # follow its member relation

      create:
        tuple_to_userset:
          tupleset:
            relation: writer
          computed_userset:
            relation: member

  role:
    relations:
      member: {}   # users added to role via tuple

  user: {}