namespaces:
  doc:
    relations:
      read:
        tuple_to_userset:
          tupleset:
            relation: read       # points to role object (e.g. role:reader)
          computed_userset:
            relation: member     # follow its member relation

      create:
        tuple_to_userset:
          tupleset:
            relation: create
          computed_userset:
            relation: member

  role:
    relations:
      member: {}   # users added to role via tuple


